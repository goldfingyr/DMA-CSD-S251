services:

    # https://www.zaproxy.org/faq/how-can-you-use-zap-to-scan-apis/
    # https://github.com/secureCodeBox/scanner-webapplication-zap
    zap:
        image: securecodebox/zap
        container_name: zap
        user: zap
        command: zap-webswing.sh
        ports:
            - 8080:8080
            - 8090:8090

    testssh:
        image: ghcr.io/shartge/testssl-web
        container_name: testssh
        ports:
            - 5000:5000
    
    juiceshop:
        image: bkimminich/juice-shop
        container_name: juiceshop
        ports:
            - 3000:3000
        environment:
            NODE_ENV: unsafe
